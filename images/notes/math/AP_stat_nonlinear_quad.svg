<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Quadratic inverted U: stress vs. performance">
  <defs>
    <style>
      .axis { stroke: #333; stroke-width: 2; }
      .grid { stroke: #eee; stroke-width: 1; }
      .tick { stroke: #333; stroke-width: 1; }
      .label { fill: #333; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 12px; }
      .title { fill: #111; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 16px; font-weight: 600; }
      .point { fill: #e53935; opacity: 0.9; }
      .curve { stroke: #d14; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect x="60" y="30" width="550" height="280" fill="#fff" stroke="#ddd" />
  <!-- axes -->
  <line class="axis" x1="60" y1="310" x2="610" y2="310" />
  <line class="axis" x1="60" y1="310" x2="60" y2="30" />
  <text class="label" x="335" y="340" text-anchor="middle">Stress index</text>
  <text class="label" x="20" y="170" transform="rotate(-90 20 170)" text-anchor="middle">Performance</text>
  <!-- points: inverted U -->
  <g>
    <circle class="point" cx="90" cy="260" r="4" />
    <circle class="point" cx="150" cy="200" r="4" />
    <circle class="point" cx="210" cy="150" r="4" />
    <circle class="point" cx="270" cy="110" r="4" />
    <circle class="point" cx="330" cy="95" r="4" />
    <circle class="point" cx="390" cy="110" r="4" />
    <circle class="point" cx="450" cy="150" r="4" />
    <circle class="point" cx="510" cy="200" r="4" />
    <circle class="point" cx="570" cy="260" r="4" />
  </g>
  <!-- quadratic curve guide (inverted U) -->
  <path class="curve" d="M80,270 C240,60 400,60 560,270" />
  <text class="title" x="320" y="20" text-anchor="middle">Quadratic (Inverted U)</text>
</svg>
