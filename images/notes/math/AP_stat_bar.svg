<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="260" viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="720" height="260" fill="#ffffff" />

  <!-- Title -->
  <text x="360" y="22" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold">
    Bar chart vs. Segmented bar chart (example)
  </text>

  <!-- Left: Simple bar chart -->
  <g transform="translate(60,50)" font-family="sans-serif">
    <text x="140" y="-10" text-anchor="middle" font-size="13" font-weight="bold">
      Bar chart: Favorite drink
    </text>

    <!-- Axes -->
    <line x1="0" y1="180" x2="280" y2="180" stroke="#000" stroke-width="1" />
    <line x1="40" y1="40" x2="40" y2="180" stroke="#000" stroke-width="1" />

    <!-- Y-axis ticks (0, 20, 40, 60) -->
    <line x1="36" y1="180" x2="40" y2="180" stroke="#000" />
    <text x="32" y="184" text-anchor="end" font-size="11">0</text>

    <line x1="36" y1="130" x2="40" y2="130" stroke="#000" />
    <text x="32" y="134" text-anchor="end" font-size="11">20</text>

    <line x1="36" y1="80" x2="40" y2="80" stroke="#000" />
    <text x="32" y="84" text-anchor="end" font-size="11">40</text>

    <line x1="36" y1="30" x2="40" y2="30" stroke="#000" />
    <text x="32" y="34" text-anchor="end" font-size="11">60</text>

    <!-- Bars: Coffee 50, Tea 30, Other 20 (scale: 60 -> 140px) -->
    <!-- Coffee -->
    <rect x="70" y="63.33333333333333" width="40" height="116.66666666666667" fill="#66b3ff" />
    <!-- Tea -->
    <rect x="130" y="110.0" width="40" height="70.0" fill="#ffcc66" />
    <!-- Other -->
    <rect x="190" y="133.33333333333331" width="40" height="46.66666666666667" fill="#99dd99" />

    <!-- X labels -->
    <text x="90" y="198" text-anchor="middle" font-size="12">Coffee</text>
    <text x="150" y="198" text-anchor="middle" font-size="12">Tea</text>
    <text x="210" y="198" text-anchor="middle" font-size="12">Other</text>
  </g>

  <!-- Right: Segmented bar chart -->
  <g transform="translate(400,50)" font-family="sans-serif">
    <text x="140" y="-10" text-anchor="middle" font-size="13" font-weight="bold">
      Segmented bar chart: Drink by customer type
    </text>

    <!-- Axes -->
    <line x1="0" y1="180" x2="280" y2="180" stroke="#000" stroke-width="1" />
    <line x1="40" y1="40" x2="40" y2="180" stroke="#000" stroke-width="1" />

    <!-- Y-axis ticks (0%, 50%, 100%) -->
    <line x1="36" y1="180" x2="40" y2="180" stroke="#000" />
    <text x="32" y="184" text-anchor="end" font-size="11">0%</text>

    <line x1="36" y1="110" x2="40" y2="110" stroke="#000" />
    <text x="32" y="114" text-anchor="end" font-size="11">50%</text>

    <line x1="36" y1="40" x2="40" y2="40" stroke="#000" />
    <text x="32" y="44" text-anchor="end" font-size="11">100%</text>

    <!-- Segmented bars: each full height 140px (0–100%) -->
    <!-- Regular customers: Coffee 60%, Tea 25%, Other 15% -->
    <!-- Coffee segment -->
    <rect x="80" y="96.0" width="50" height="84.0" fill="#66b3ff" />
    <!-- Tea segment -->
    <rect x="80" y="61.0" width="50" height="35.0" fill="#ffcc66" />
    <!-- Other segment -->
    <rect x="80" y="40.0" width="50" height="21.0" fill="#99dd99" />

    <!-- New customers: Coffee 35%, Tea 40%, Other 25% -->
    <!-- Coffee segment -->
    <rect x="170" y="131.0" width="50" height="49.0" fill="#66b3ff" />
    <!-- Tea segment -->
    <rect x="170" y="75.0" width="50" height="56.0" fill="#ffcc66" />
    <!-- Other segment -->
    <rect x="170" y="40.0" width="50" height="35.0" fill="#99dd99" />

    <!-- X labels -->
    <text x="105" y="198" text-anchor="middle" font-size="12">Regular</text>
    <text x="195" y="198" text-anchor="middle" font-size="12">New</text>

    <!-- Legend -->
    <g transform="translate(190,50)" font-size="11">
      <rect x="-260" y="0" width="10" height="10" fill="#66b3ff" />
      <text x="-246" y="9">Coffee</text>

      <rect x="-260" y="18" width="10" height="10" fill="#ffcc66" />
      <text x="-246" y="27">Tea</text>

      <rect x="-260" y="36" width="10" height="10" fill="#99dd99" />
      <text x="-246" y="45">Other</text>
    </g>
  </g>
</svg>
