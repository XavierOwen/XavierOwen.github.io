<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="260" viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="720" height="260" fill="#f7fbff" />
  <text x="360" y="26" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold">
    Titanic passengers: ticket class &amp; survival (categorical)
  </text>

  <g transform="translate(40,70)">
    <rect x="0" y="120" width="300" height="70" fill="#cce6ff" />
    <path d="M0 130 Q 15 120 30 130 T 60 130 T 90 130 T 120 130 T 150 130 T 180 130 T 210 130 T 240 130 T 270 130 T 300 130"
          fill="none" stroke="#99ccff" stroke-width="2" />
    <polygon points="40,110 260,110 240,150 60,150" fill="#444b5a" />
    <circle cx="90" cy="130" r="4" fill="#f9f9f9" />
    <circle cx="115" cy="130" r="4" fill="#f9f9f9" />
    <circle cx="140" cy="130" r="4" fill="#f9f9f9" />
    <circle cx="165" cy="130" r="4" fill="#f9f9f9" />
    <circle cx="190" cy="130" r="4" fill="#f9f9f9" />
    <circle cx="215" cy="130" r="4" fill="#f9f9f9" />
    <rect x="80" y="85" width="140" height="25" fill="#ffffff" stroke="#d0d0d0" />
    <g>
      <rect x="95" y="55" width="18" height="30" fill="#ffcc66" stroke="#d9a744" />
      <rect x="130" y="50" width="18" height="35" fill="#ffcc66" stroke="#d9a744" />
      <rect x="165" y="55" width="18" height="30" fill="#ffcc66" stroke="#d9a744" />
    </g>
    <circle cx="104" cy="45" r="5" fill="#d9d9d9" opacity="0.8" />
    <circle cx="137" cy="35" r="6" fill="#d9d9d9" opacity="0.8" />
    <circle cx="175" cy="42" r="5" fill="#d9d9d9" opacity="0.8" />
    <text x="150" y="180" text-anchor="middle" font-family="sans-serif" font-size="12">
      Each passenger has a ticket class and a survival status.
    </text>
  </g>

  <g transform="translate(380,60)" font-family="sans-serif">
    <text x="140" y="0" text-anchor="middle" font-size="14" font-weight="bold">
      Ticket class vs survival (categorical × categorical)
    </text>
    <rect x="20" y="20" width="240" height="150" fill="#ffffff" stroke="#cccccc" />
    <rect x="55" y="114.5" width="40" height="45.5" fill="#ff9999" />
    <rect x="55" y="30.0" width="40" height="84.5" fill="#8fd3a8" />
    <rect x="125" y="88.5" width="40" height="71.5" fill="#ff9999" />
    <rect x="125" y="30.0" width="40" height="58.5" fill="#8fd3a8" />
    <rect x="195" y="62.5" width="40" height="97.5" fill="#ff9999" />
    <rect x="195" y="30.0" width="40" height="32.5" fill="#8fd3a8" />
    <text x="75" y="182" text-anchor="middle" font-size="12">1st class</text>
    <text x="145" y="182" text-anchor="middle" font-size="12">2nd class</text>
    <text x="215" y="182" text-anchor="middle" font-size="12">3rd class</text>
    <text x="30" y="35" font-size="10">100%</text>
    <text x="30" y="95" font-size="10">50%</text>
    <text x="30" y="155" font-size="10">0%</text>
    <line x1="40" y1="40" x2="260" y2="40" stroke="#eeeeee" />
    <line x1="40" y1="100" x2="260" y2="100" stroke="#eeeeee" />
    <line x1="40" y1="160" x2="260" y2="160" stroke="#eeeeee" />
    <g transform="translate(20,200)" font-size="11">
      <rect x="0" y="0" width="12" height="12" fill="#8fd3a8" />
      <text x="18" y="10">Survived (categorical value)</text>
      <rect x="0" y="18" width="12" height="12" fill="#ff9999" />
      <text x="18" y="28">Did not survive (categorical value)</text>
    </g>
    <text x="140" y="220" text-anchor="middle" font-size="11">
      Both ticket class (1st/2nd/3rd) and survival (yes/no) are categorical variables.
    </text>
  </g>
</svg>
