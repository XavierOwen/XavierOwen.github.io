<?xml version="1.0" encoding="UTF-8"?>
<svg width="520" height="260" viewBox="0 0 520 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#fffdf7"/>

  <text x="260" y="24" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">
    Commute Time Histogram (Smaller SD)
  </text>

  <!-- Axes -->
  <line x1="50" y1="200" x2="480" y2="200" stroke="#333" stroke-width="1.5"/>
  <line x1="50" y1="60" x2="50" y2="200" stroke="#333" stroke-width="1.5"/>

  <!-- Y-ticks -->
  <line x1="50" y1="200" x2="45" y2="200" stroke="#333"/><text x="40" y="203" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
  <line x1="50" y1="168" x2="45" y2="168" stroke="#333"/><text x="40" y="171" text-anchor="end" font-family="sans-serif" font-size="11">4</text>
  <line x1="50" y1="136" x2="45" y2="136" stroke="#333"/><text x="40" y="139" text-anchor="end" font-family="sans-serif" font-size="11">8</text>
  <line x1="50" y1="104" x2="45" y2="104" stroke="#333"/><text x="40" y="107" text-anchor="end" font-family="sans-serif" font-size="11">12</text>
  <line x1="50" y1="72" x2="45" y2="72" stroke="#333"/><text x="40" y="75" text-anchor="end" font-family="sans-serif" font-size="11">16</text>

  <!-- Bars -->
  <!-- 0–10: count = 0 -->
  <rect x="60" y="200" width="60" height="0" fill="#74c0fc"/>

  <!-- 10–20: count = 3 -->
  <rect x="125" y="176" width="60" height="24" fill="#74c0fc"/>

  <!-- 20–30: count = 16 -->
  <rect x="190" y="72" width="60" height="128" fill="#74c0fc"/>

  <!-- 30–40: count = 1 -->
  <rect x="255" y="192" width="60" height="8" fill="#74c0fc"/>

  <!-- 40–50: count = 0 -->
  <rect x="320" y="200" width="60" height="0" fill="#74c0fc"/>

  <!-- 50–60: count = 0 -->
  <rect x="385" y="200" width="60" height="0" fill="#74c0fc"/>

  <!-- X labels -->
  <text x="90.0" y="215" text-anchor="middle" font-family="sans-serif" font-size="11">0–10</text>
  <text x="155.0" y="215" text-anchor="middle" font-family="sans-serif" font-size="11">10–20</text>
  <text x="220.0" y="215" text-anchor="middle" font-family="sans-serif" font-size="11">20–30</text>
  <text x="285.0" y="215" text-anchor="middle" font-family="sans-serif" font-size="11">30–40</text>
  <text x="350.0" y="215" text-anchor="middle" font-family="sans-serif" font-size="11">40–50</text>
  <text x="415.0" y="215" text-anchor="middle" font-family="sans-serif" font-size="11">50–60</text>

  <!-- Axis labels -->
  <text x="260" y="245" text-anchor="middle" font-family="sans-serif" font-size="12">
    commute time (minutes)
  </text>

  <text x="15" y="130" transform="rotate(-90 15 130)"
        text-anchor="middle" font-family="sans-serif" font-size="12">
    frequency
  </text>
</svg>