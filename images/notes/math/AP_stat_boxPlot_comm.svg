<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="200" viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle"
        font-family="sans-serif" font-size="20" font-weight="bold">
    AP Statistics Boxplot of Commute Times
  </text>

  <!-- Axis baseline -->
  <line x1="70" y1="110" x2="650" y2="110" stroke="#000" stroke-width="1.6"/>

  <!-- Mapping 0–60 to 70–650 -->
  <!-- x = 70 + (value/60)*580 -->

  <!-- Non-outlier max = 55 -->
  <line x1="631.7" y1="100" x2="631.7" y2="120" stroke="#000" stroke-width="2"/>

  <!-- Whisker -->
  <line x1="149.3" y1="110" x2="631.7" y2="110" stroke="#000" stroke-width="2"/>

  <!-- Min tick (8) -->
  <line x1="149.3" y1="100" x2="149.3" y2="120" stroke="#000" stroke-width="2"/>
  <text x="149.3" y="80" text-anchor="middle"
        font-family="sans-serif" font-size="12">Min = 8</text>
  <!-- Max tick (55) -->
  <text x="631.7" y="80" text-anchor="middle"
        font-family="sans-serif" font-size="12">Max non-outlier = 55</text>

  <!-- Box: Q1=18, Q3=33 -->
  <rect x="244" y="90" width="145" height="40"
        fill="#d0e4ff" stroke="#000" stroke-width="1.5"/>

  <!-- Median 23 -->
  <line x1="266.3" y1="90" x2="266.3" y2="130" stroke="#000" stroke-width="2"/>

  <!-- Box labels -->
  <text x="244" y="160" text-anchor="middle" font-family="sans-serif" font-size="12">Q1 = 18.5</text>
  <text x="280" y="80" text-anchor="middle" font-family="sans-serif" font-size="12">Median = 24.5</text>
  <text x="387" y="160" text-anchor="middle" font-family="sans-serif" font-size="12">Q3 = 34</text>

  <!-- OUTLIER: 60 -->
  <circle cx="650" cy="110" r="5" fill="none" stroke="#000" stroke-width="2"/>
  <text x="650" y="140" text-anchor="middle" font-family="sans-serif" font-size="12">Outlier: 60</text>

  <!-- Legend text -->
  <text x="360" y="185" text-anchor="middle" font-family="sans-serif" font-size="12">
    Whiskers extend to min/max non-outliers; isolated points represent outliers.
  </text>

</svg>