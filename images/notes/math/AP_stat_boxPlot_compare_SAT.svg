<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="300" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
    SAT Scores: Prep Course vs. No Prep Course
  </text>

  <!-- Horizontal axis (SAT score scale: 900-1600) -->
  <!-- x-coordinate mapping: score 900 → x=100, score 1600 → x=650 -->
  <!-- Formula: x = 100 + (score - 900) * (550/700) -->

  <!-- Axis line -->
  <line x1="100" y1="250" x2="650" y2="250" stroke="#333" stroke-width="2"/>

  <!-- Axis labels -->
  <text x="100" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">900</text>
  <text x="237" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">1100</text>
  <text x="375" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">1300</text>
  <text x="512" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">1500</text>
  <text x="650" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">1600</text>

  <!-- Axis tick marks -->
  <line x1="100" y1="245" x2="100" y2="255" stroke="#333" stroke-width="2"/>
  <line x1="237" y1="245" x2="237" y2="255" stroke="#333" stroke-width="2"/>
  <line x1="375" y1="245" x2="375" y2="255" stroke="#333" stroke-width="2"/>
  <line x1="512" y1="245" x2="512" y2="255" stroke="#333" stroke-width="2"/>
  <line x1="650" y1="245" x2="650" y2="255" stroke="#333" stroke-width="2"/>

  <!-- No Prep Course (top boxplot) -->
  <!-- Min=950 (x≈139), Q1=1045 (x≈214), Med=1200 (x≈336), Q3=1295 (x≈410), Max=1450 (x≈532) -->

  <text x="50" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c62828">No Prep</text>

  <!-- Whiskers -->
  <line x1="139" y1="80" x2="214" y2="80" stroke="#c62828" stroke-width="2"/>
  <line x1="410" y1="80" x2="532" y2="80" stroke="#c62828" stroke-width="2"/>
  <line x1="139" y1="70" x2="139" y2="90" stroke="#c62828" stroke-width="2"/>
  <line x1="532" y1="70" x2="532" y2="90" stroke="#c62828" stroke-width="2"/>

  <!-- Box (Q1 to Q3) -->
  <rect x="214" y="60" width="196" height="40" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>

  <!-- Median line -->
  <line x1="336" y1="60" x2="336" y2="100" stroke="#c62828" stroke-width="3"/>

  <!-- Prep Course (bottom boxplot) -->
  <!-- Min=1100 (x≈237), Q1=1275 (x≈394), Med=1350 (x≈453), Q3=1445 (x≈528), Max=1550 (x≈610) -->

  <text x="50" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1565c0">Prep</text>

  <!-- Whiskers -->
  <line x1="237" y1="160" x2="394" y2="160" stroke="#1565c0" stroke-width="2"/>
  <line x1="528" y1="160" x2="610" y2="160" stroke="#1565c0" stroke-width="2"/>
  <line x1="237" y1="150" x2="237" y2="170" stroke="#1565c0" stroke-width="2"/>
  <line x1="610" y1="150" x2="610" y2="170" stroke="#1565c0" stroke-width="2"/>

  <!-- Box (Q1 to Q3) -->
  <rect x="394" y="140" width="134" height="40" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>

  <!-- Median line -->
  <line x1="453" y1="140" x2="453" y2="180" stroke="#1565c0" stroke-width="3"/>

  <!-- Legend -->
  <rect x="550" y="200" width="20" height="15" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="575" y="211" font-family="Arial, sans-serif" font-size="11" fill="#333">No Prep Course</text>

  <rect x="550" y="220" width="20" height="15" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="575" y="231" font-family="Arial, sans-serif" font-size="11" fill="#333">Prep Course</text>
</svg>