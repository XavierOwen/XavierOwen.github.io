<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="220" viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="640" height="220" fill="#ffffff" />
  <text x="320" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold">
    Is it categorical or quantitative?
  </text>

  <rect x="40" y="50" width="250" height="140" rx="10" ry="10" fill="#f3f3ff" stroke="#ccccff"/>
  <rect x="70" y="70" width="50" height="80" rx="8" ry="8" fill="#ffffff" stroke="#666"/>
  <rect x="78" y="80" width="34" height="50" rx="4" ry="4" fill="#e6e6e6"/>
  <circle cx="95" cy="122" r="4" fill="#999"/>
  <text x="135" y="95" font-family="sans-serif" font-size="14">(212) 555-0198</text>
  <text x="135" y="115" font-family="sans-serif" font-size="14">(646) 555-4420</text>
  <text x="165" y="145" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">
    Phone number
  </text>
  <text x="165" y="165" text-anchor="middle" font-family="sans-serif" font-size="12">
    Categorical: a label, not a measurement
  </text>

  <rect x="350" y="50" width="250" height="140" rx="10" ry="10" fill="#f3fff3" stroke="#bfe6bf"/>
  <circle cx="390" cy="95" r="6" fill="#66b3ff"/>
  <circle cx="415" cy="95" r="6" fill="#66b3ff"/>
  <circle cx="440" cy="95" r="6" fill="#66b3ff"/>
  <circle cx="465" cy="95" r="6" fill="#66b3ff"/>
  <circle cx="490" cy="95" r="6" fill="#66b3ff"/>
  <circle cx="515" cy="95" r="6" fill="#66b3ff"/>
  <circle cx="540" cy="95" r="6" fill="#66b3ff"/>

  <line x1="380" y1="140" x2="560" y2="140" stroke="#666"/>
  <line x1="380" y1="135" x2="380" y2="145" stroke="#666"/>
  <line x1="470" y1="135" x2="470" y2="145" stroke="#666"/>
  <line x1="560" y1="135" x2="560" y2="145" stroke="#666"/>

  <text x="380" y="158" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
  <text x="470" y="158" text-anchor="middle" font-family="sans-serif" font-size="11">50</text>
  <text x="560" y="158" text-anchor="middle" font-family="sans-serif" font-size="11">100</text>

  <text x="475" y="75" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">
    Number of contacts
  </text>
  <text x="475" y="175" text-anchor="middle" font-family="sans-serif" font-size="12">
    Quantitative: a count you can average
  </text>
</svg>
