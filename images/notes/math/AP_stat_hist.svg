<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="260" viewBox="0 0 500 260" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="500" height="260" fill="#fffdf7"/>

  <!-- Title -->
  <text x="250" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">
    Example histogram
  </text>
  <text x="250" y="48" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">
    Test scores grouped into bins
  </text>

  <!-- Axes -->
  <line x1="60" y1="200" x2="440" y2="200" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="60" x2="60" y2="200" stroke="#333" stroke-width="1.5"/>

  <!-- Y-axis ticks -->
  <line x1="56" y1="200" x2="60" y2="200" stroke="#333"/>
  <text x="50" y="203" text-anchor="end" font-family="sans-serif" font-size="11">0</text>

  <line x1="56" y1="160" x2="60" y2="160" stroke="#333"/>
  <text x="50" y="163" text-anchor="end" font-family="sans-serif" font-size="11">5</text>

  <line x1="56" y1="120" x2="60" y2="120" stroke="#333"/>
  <text x="50" y="123" text-anchor="end" font-family="sans-serif" font-size="11">10</text>

  <line x1="56" y1="80" x2="60" y2="80" stroke="#333"/>
  <text x="50" y="83" text-anchor="end" font-family="sans-serif" font-size="11">15</text>

  <!-- Bins and counts (0-10,10-20,...,50-60) -->
  <!-- heights scaled: 1 count = 8 px -->
  <!-- counts: [3, 7, 12, 15, 9, 4] -->
  <!-- Bin 1 -->
  <rect x="70" y="176" width="55" height="24" fill="#a5d8ff" />
  <!-- Bin 2 -->
  <rect x="130" y="144" width="55" height="56" fill="#74c0fc" />
  <!-- Bin 3 -->
  <rect x="190" y="104" width="55" height="96" fill="#4dabf7" />
  <!-- Bin 4 -->
  <rect x="250" y="80" width="55" height="120" fill="#339af0" />
  <!-- Bin 5 -->
  <rect x="310" y="128" width="55" height="72" fill="#228be6" />
  <!-- Bin 6 -->
  <rect x="370" y="168" width="55" height="32" fill="#1971c2" />

  <!-- X-axis labels -->
  <text x="97.5" y="215" text-anchor="middle" font-family="sans-serif" font-size="11">0–10</text>
  <text x="157.5" y="215" text-anchor="middle" font-family="sans-serif" font-size="11">10–20</text>
  <text x="217.5" y="215" text-anchor="middle" font-family="sans-serif" font-size="11">20–30</text>
  <text x="277.5" y="215" text-anchor="middle" font-family="sans-serif" font-size="11">30–40</text>
  <text x="337.5" y="215" text-anchor="middle" font-family="sans-serif" font-size="11">40–50</text>
  <text x="397.5" y="215" text-anchor="middle" font-family="sans-serif" font-size="11">50–60</text>

  <!-- Axis caption -->
  <text x="250" y="238" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">
    score interval
  </text>
  <text x="20" y="130" transform="rotate(-90 20 130)" text-anchor="middle"
        font-family="sans-serif" font-size="12" fill="#333">
    number of students
  </text>
</svg>
