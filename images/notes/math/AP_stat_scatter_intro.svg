<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Scatterplot showing positive correlation: x=study time (hours), y=exam score">
  <defs>
    <style>
      .axis { stroke: #333; stroke-width: 2; }
      .grid { stroke: #ddd; stroke-width: 1; }
      .tick { stroke: #333; stroke-width: 1; }
      .label { fill: #333; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 12px; }
      .title { fill: #111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 16px; font-weight: 600; }
      .point { fill: #2a7cff; opacity: 0.9; }
      .trend { stroke: #d14; stroke-width: 2; stroke-dasharray: 4 3; }
    </style>
  </defs>

  <!-- chart area -->
  <rect x="60" y="30" width="550" height="280" fill="#fff" stroke="#eee" />

  <!-- grid lines -->
  <g>
    <!-- horizontal grid -->
    <line class="grid" x1="60" y1="310" x2="610" y2="310" />
    <line class="grid" x1="60" y1="270" x2="610" y2="270" />
    <line class="grid" x1="60" y1="230" x2="610" y2="230" />
    <line class="grid" x1="60" y1="190" x2="610" y2="190" />
    <line class="grid" x1="60" y1="150" x2="610" y2="150" />
    <line class="grid" x1="60" y1="110" x2="610" y2="110" />
    <line class="grid" x1="60" y1="70" x2="610" y2="70" />

    <!-- vertical grid -->
    <line class="grid" x1="60" y1="310" x2="60" y2="30" />
    <line class="grid" x1="150" y1="310" x2="150" y2="30" />
    <line class="grid" x1="240" y1="310" x2="240" y2="30" />
    <line class="grid" x1="330" y1="310" x2="330" y2="30" />
    <line class="grid" x1="420" y1="310" x2="420" y2="30" />
    <line class="grid" x1="510" y1="310" x2="510" y2="30" />
    <line class="grid" x1="600" y1="310" x2="600" y2="30" />
  </g>

  <!-- axes -->
  <line class="axis" x1="60" y1="310" x2="610" y2="310" />
  <line class="axis" x1="60" y1="310" x2="60" y2="30" />

  <!-- axis labels -->
  <text class="label" x="335" y="340" text-anchor="middle">Study time (hours)</text>
  <text class="label" x="20" y="170" transform="rotate(-90 20 170)" text-anchor="middle">Exam score</text>

  <!-- ticks and tick labels: x -->
  <g>
    <line class="tick" x1="150" y1="310" x2="150" y2="315" />
    <text class="label" x="150" y="328" text-anchor="middle">2</text>
    <line class="tick" x1="240" y1="310" x2="240" y2="315" />
    <text class="label" x="240" y="328" text-anchor="middle">4</text>
    <line class="tick" x1="330" y1="310" x2="330" y2="315" />
    <text class="label" x="330" y="328" text-anchor="middle">6</text>
    <line class="tick" x1="420" y1="310" x2="420" y2="315" />
    <text class="label" x="420" y="328" text-anchor="middle">8</text>
    <line class="tick" x1="510" y1="310" x2="510" y2="315" />
    <text class="label" x="510" y="328" text-anchor="middle">10</text>
  </g>

  <!-- ticks and tick labels: y -->
  <g>
    <line class="tick" x1="60" y1="270" x2="55" y2="270" />
    <text class="label" x="50" y="274" text-anchor="end">60</text>
    <line class="tick" x1="60" y1="230" x2="55" y2="230" />
    <text class="label" x="50" y="234" text-anchor="end">70</text>
    <line class="tick" x1="60" y1="190" x2="55" y2="190" />
    <text class="label" x="50" y="194" text-anchor="end">80</text>
    <line class="tick" x1="60" y1="150" x2="55" y2="150" />
    <text class="label" x="50" y="154" text-anchor="end">90</text>
    <line class="tick" x1="60" y1="110" x2="55" y2="110" />
    <text class="label" x="50" y="114" text-anchor="end">100</text>
  </g>

  <!-- points (roughly increasing trend) -->
  <g>
    <circle class="point" cx="110" cy="263" r="4" /> <!-- x~1, y~62 -->
    <circle class="point" cx="150" cy="242" r="4" /> <!-- 2, 65 -->
    <circle class="point" cx="200" cy="231" r="4" /> <!-- 3, 70 -->
    <circle class="point" cx="240" cy="215" r="4" /> <!-- 4, 75 -->
    <circle class="point" cx="280" cy="200" r="4" /> <!-- 5, 78 -->
    <circle class="point" cx="330" cy="177" r="4" /> <!-- 6, 82 -->
    <circle class="point" cx="380" cy="168" r="4" /> <!-- 7, 85 -->
    <circle class="point" cx="420" cy="150" r="4" /> <!-- 8, 88 -->
    <circle class="point" cx="470" cy="133" r="4" /> <!-- 9, 91 -->
    <circle class="point" cx="510" cy="111" r="4" /> <!-- 10, 95 -->
  </g>

  <!-- trend line (simple visual) -->
  <line class="trend" x1="100" y1="265" x2="520" y2="110" />

  <!-- title -->
  <text class="title" x="320" y="20" text-anchor="middle">Positive Association: More Study Time → Higher Scores</text>
</svg>
