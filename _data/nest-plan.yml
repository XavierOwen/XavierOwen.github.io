local_resources:
  - title: 产科与儿科门诊 · UChicago South Loop
    detail: 1101 S. Canal St., Suite 201/202 · 877-336-5667。页面列有产前照护、助产士、超声及儿科；先确认新病人、保险和实际分娩医院。超声需要预约。
    url: https://www.uchicagomedicine.org/find-a-location/uchicago-medicine-south-loop
  - title: 分娩中心 · UChicago Hyde Park
    detail: 5721 S. Maryland Ave. · 773-702-1000。作为可咨询的候选入口；接生团队、保险、入口和夜间流程都需确认。
    url: https://www.uchicagomedicine.org/find-a-location/uchicago-medicine-family-birth-center-hyde-park
  - title: Illinois Tech · 学生保险（如适用）
    detail: 从当期计划查网络、自付额和转诊要求；学生与员工计划不同。本页列出学校入口，不表示个人一定参加该保险。
    url: https://www.iit.edu/shwc/insurance/plan-info-and-requirements
  - title: Illinois Moms & Babies / MPE
    detail: MPE 为符合条件孕妇提供临时门诊覆盖；Moms & Babies 可覆盖孕期、分娩及产后照护。按个人资格申请，不能仅凭住址判断获批。
    url: https://hfs.illinois.gov/medicalprograms/allkids/momsandbabies.html
  - title: Illinois WIC · 营养、食品及喂养支持
    detail: 面向符合条件的孕妇、产后妇女、婴儿和幼儿。通过官方入口查资格及本地办理点。
    url: https://wegotyouillinois.org/wic/
  - title: 座椅安装 · NHTSA检查点
    detail: 按地点寻找并预约检查；携带车辆与座椅说明书。线上看完教程不等于安装已通过检查。
    url: https://www.nhtsa.gov/vehicle-safety/car-seats-and-booster-seats
safety:
  - title: 孕期与产后：不等清单，也不等预约
    detail: 胸痛、呼吸困难、昏厥、持续严重头痛或视物改变、严重腹痛、大量出血或流液、单侧腿肿痛、胎动明显减少等，立即联系医疗团队；情况严重或无法及时联系时拨911或去急诊。产后一年内也要留意孕产相关警讯。
    url: https://www.cdc.gov/hearher/maternal-warning-signs/index.html
  - title: 三个月及以下宝宝发热
    detail: 直肠温度达到38°C（100.4°F）即应立即联系儿科，即使暂时没有别的症状。呼吸费力、发青、无反应或难叫醒需立即急救；不先自行给退烧药后等待。
    url: https://www.healthychildren.org/English/health-issues/conditions/fever/pages/fever-and-your-baby.aspx
  - title: 数字只作记录，症状需要人来评估
    detail: 本页不诊断血压、体重、黄疸或喂养是否正常。向团队问清个人报告阈值；胎动改变时不靠家用胎心仪排除异常。任何强烈担心都可以提前联系团队。
    url: https://www.cdc.gov/hearher/maternal-warning-signs/index.html
