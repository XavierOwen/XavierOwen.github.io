reviewed: '2026-10-29'
intro: 从备孕到出生后六周，把就医、生活准备和家人分工放在同一条时间线上。孕周由末次月经第一天起算；用预产期时倒推280天。推算日期只帮助安排，医院更正的孕周和医嘱优先。
sections:
  - id: before
    number: '00'
    title: 一起起步
    subtitle: 从零准备 · 先谈安排、查保险、整理就诊资料
    anchor: preconception
    start: -90
    end: 0
    tasks:
      - id: shared-plan
        title: 商量开始尝试的时间、分工和预算
        who: 共同
        category: 协作
        when: 现在即可；先有大致安排，不必先填预产期
        control: progress
        detail:
          - 谈清什么时候愿意开始尝试、谁预约和陪诊、怎样分担做饭和家务；预留看诊、交通、产后帮手与休假期间的预算。
          - 盘点已有物品和住房空间。现阶段优先准备女方叶酸、就诊资料，以及确有需要的检测用品；婴儿床、汽车座椅、奶粉和大量尿布留在后续采购阶段。
          - 下方有女方、男方和采购分组；也可把“任务类别”选为“采购”，集中查看现在能买、按需买和暂缓买的物品。
        sources: [prepregnancy, tuoba]
      - id: preconception-visit
        title: 分别整理病史、用药和疫苗记录，安排孕前咨询
        who: 共同
        category: 就医
        when: 准备开始时；尽量在尝试怀孕前留出就诊和调整时间
        control: check
        detail:
          - 女方可约 OB-GYN（妇产科）或家庭医生，说明希望做 preconception visit（孕前咨询）；男方可先向 PCP（家庭／全科医生）说明生育计划，按病史决定是否另转专科。
          - 各自准备慢性病、手术与生殖相关病史、家族遗传病史、既往检查结果和疫苗记录；女方再带月经和既往孕产资料。没有记录的写“不清楚”，不必先买一套检查套餐。
          - 所有处方药、非处方药、草药、维生素和健身补剂都拍下标签；写清每天用多少。请原开药医生参与调整，不自行停药。
          - 一起复核烟酒、娱乐性药物和工作／家中暴露；女方从开始尝试起避免饮酒，戒烟并避免二手烟。男方也处理吸烟、过量饮酒等风险，有困难时向医生求助。
          - 就诊时问清接下来需要哪些检查、是否空腹、保险和费用、何时看结果，以及是否需要在开始尝试前完成治疗或接种。
        sources: [prepregnancy-counseling, male-health]
      - id: insurance-first
        title: 查保险，问清产检与分娩分别在哪里
        who: 共同
        category: 协作
        when: 现在就可以打电话
        control: progress
        detail:
          - 向保险确认产科医生、分娩医院、化验、超声、麻醉和儿科是否在网络内（in-network），记录问询日期及答复编号。
          - 问清 deductible（先自付的额度）、coinsurance（按比例分担）、out-of-pocket maximum（年度自付上限）及跨保险年度时如何计算。报价不能当作最终账单。
          - 若用学校保险，从 IIT 当期计划入口查；同时看看是否符合 Illinois Moms & Babies 或 WIC 的申请条件。
        sources: [iit, moms, wic]
      - id: preconception-screening
        title: 一起讨论遗传携带筛查与到期的感染筛查
        who: 共同
        category: 就医
        when: 孕前咨询时讨论，尽量在怀孕前了解选择
        control: check
        detail:
          - carrier screening（遗传病携带者筛查）检查是否携带可能传给孩子的遗传变异；携带不等于本人患病。没有家族史也可以讨论，先查既往结果，选择检测范围。
          - 如果一方查出有关变异，再讨论伴侣检测与遗传咨询。它不同于怀孕后的胎儿染色体筛查，也不同于男方不育病因的遗传检查。
          - 把双方 HIV、乙肝／丙肝等既往结果交给医生，核对成人常规筛查是否完成；梅毒、衣原体／淋病等按年龄、症状和暴露风险选择，不把“全套性病检查”当作每对新手都必须购买的套餐。
        sources: [prepregnancy-counseling, carrier, sti-testing, hepatitis-b-screening]
      - id: when-to-seek-fertility-care
        title: 了解尝试节奏，以及何时双方一起就诊
        who: 共同
        category: 协作
        when: 开始尝试前了解；有明确风险可提前就诊
        control: check
        detail:
          - 有规律的无保护性生活比依赖一个“精确排卵日”更实用；易孕期通常是排卵当天和此前5天，期间每1–2天同房较有利，每周2–3次的机会也接近。无需长期禁欲来“攒精”。
          - 女方小于35岁，规律尝试12个月未孕；35–40岁，6个月未孕时咨询评估。超过40岁可开始时就咨询，讨论尽快评估。
          - 月经明显不规则、已知输卵管或生殖问题、男方相关风险或性功能问题时，不等上述期限。需要评估时男女同步，不让女方查完一整轮才查男方。
        sources: [natural-fertility, fertility-evaluation]
  - id: before-female
    number: '00A'
    title: 女方准备
    subtitle: 叶酸、其他营养、孕前检查与接种
    anchor: preconception
    start: -90
    end: 0
    tasks:
      - id: folic-acid
        title: 买好并核对女方叶酸，安排每天补充
        who: 女方
        category: 采购
        when: 现在准备；至少在预计受孕前1个月开始
        control: check
        detail:
          - 一般风险女方，CDC 建议每日400微克（mcg＝μg，0.4毫克）folic acid；USPSTF 推荐范围为每日400–800微克。单方叶酸或含足量叶酸的 prenatal（孕前／孕期复合维生素），选一种日常来源，先买一瓶即可。
          - 看 Supplement Facts（成分表）的每份含量和每份几粒。若写“667 mcg DFE (400 mcg folic acid)”，实际这一份含400微克 folic acid；DFE 是膳食叶酸当量，不是要另加的剂量。
          - 已吃复合维生素时先核对已有叶酸，不自动再加一瓶单方。若标签只写 methylfolate／5-MTHF，不因“活性”“天然”字样就认为预防神经管缺陷的证据更好。
          - 不等验孕阳性才开始；怀孕后继续与产科核对。既往有神经管缺陷受累妊娠、有关家族史或服影响叶酸的药物者，先确认个人方案，不自行买毫克级高剂量或多吃几份复合维生素。
        sources: [folate, folate-intake, folate-recommendation, folate-label]
      - id: female-nutrient-review
        title: 查饮食缺口，再决定是否另买其他补充剂
        who: 女方
        category: 饮食
        when: 备孕开始时；单方补剂按饮食、病史或化验决定
        control: check
        detail:
          - 纯素或很少吃动物性食品者，现在就安排可靠的 B12 强化食品／补充剂来源，并向医生或营养师核对；B12 缺乏的治疗剂量另定。
          - 经量多、贫血史、素食或饮食受限时，问是否需要血常规 CBC、铁蛋白等评估；已有含铁 prenatal 时先查含量，不再自行叠加单方铁。
          - 少吃奶蛋鱼、不用碘盐或有甲状腺病时，核对饮食及产品中的碘。计划怀孕时可与医生／药师讨论含150微克碘的产品；有甲状腺病先问医生，不靠海藻高剂量产品补碘。
          - 查看强化奶／植物奶、饮食和产品中的维生素D，以及蛋、豆类等胆碱来源。把铁、碘、维D、B12、胆碱的“总摄入参考量”和“额外药片剂量”分开；不因住在芝加哥就自行买高剂量维D。
        sources: [nutrition, b12, iron, iodine, vitamin-d, choline]
      - id: female-preconception-checks
        title: 和医生逐项确定女方要查什么
        who: 女方
        category: 就医
        when: 孕前咨询时；先带记录，再确定化验单
        control: check
        detail:
          - 基础评估包括血压、身高体重、月经与既往孕产情况、用药和慢性病。可讨论血常规 CBC 与血红蛋白病评估；经量多或贫血史等情况尤其要提出，是否加铁蛋白由医生决定。
          - 糖代谢检查（如糖化血红蛋白 HbA1c）和甲状腺检查（如促甲状腺激素 TSH）看病史、症状与风险；有糖尿病或甲状腺病者应先安排管理，不自行订“甲功＋胰岛素全套”。
          - 查上次 Pap／HPV（宫颈细胞学／人乳头瘤病毒）筛查的日期与结果，到期或原有异常需随访时安排；备孕本身不要求把未到期的筛查重做一次。感染与遗传携带筛查见“一起起步”。
          - 刚开始尝试且没有不孕证据时，不默认购买 AMH（卵巢储备相关指标）“卵巢年龄”或整套 TORCH（若干孕期相关感染的组合检查）。AMH 不能单独预测自然受孕能力；请医生说明每项检查解决什么问题。
        sources: [prepregnancy-counseling, carrier-clinical, cervical-screening, ovarian-reserve, cmv]
      - id: female-vaccine-review
        title: 核对风疹、水痘等疫苗，留出接种后的等待时间
        who: 女方
        category: 就医
        when: 准备尝试前尽早核对，缺记录时问医生
        control: check
        detail:
          - 带 MMR（麻疹、腮腺炎、风疹）和水痘等疫苗记录，让医生判断免疫证据、是否需查抗体或补种，不必自己把所有抗体都重验。
          - MMR 和水痘属于活疫苗，孕期不接种。若需补种，女方 MMR 后避免怀孕28天，水痘疫苗每针后避免怀孕1个月；如需多针，留出整个接种与等待时间。
          - 其他疫苗按年龄、病史和当季建议核对；上述等待期不套用于所有疫苗。男方是否需接种按成人规则确认，不照搬女方的孕期规则。
        sources: [prepregnancy-counseling, pregnancy-vaccine-guidance, adult-vaccines]
  - id: before-male
    number: '00B'
    title: 男方准备
    subtitle: 健康和用药、补充剂取舍、何时需要生育检查
    anchor: preconception
    start: -90
    end: 0
    tasks:
      - id: male-health-review
        title: 核对男方健康、用药、疫苗和生殖相关病史
        who: 男方
        category: 就医
        when: 开始准备时；有相关风险则提前咨询
        control: check
        detail:
          - 向家庭医生说明生育计划，复核慢性病、血压体重、既往手术、隐睾或生殖系统病史、家族史，以及勃起／射精问题；有隐睾、化疗或既往生育问题等风险时主动提出，不必等满一年。
          - 把睾酮 TRT、健身用合成代谢类固醇，以及全部处方药、草药和补充剂列出来。外源性睾酮可能抑制生精，使用者应尽快联系开药医生讨论，不自行停处方或加生育药。
          - 戒烟、避免娱乐性药物，保持均衡饮食和适合自己的运动；核对成人疫苗与性健康筛查记录。男方不需要因为伴侣每次怀孕就重打一针 Tdap（破伤风、白喉、百日咳）。
        sources: [male-health, male-infertility, testosterone, adult-vaccines, sti-screening]
      - id: male-supplement-review
        title: 男方先改善饮食，不默认购买“养精补剂套餐”
        who: 男方
        category: 饮食
        when: 现在了解；有饮食限制或已知缺乏时个别处理
        control: check
        detail:
          - 男方不照抄女方用于预防胎儿神经管缺陷的叶酸方案；目前没有适用于所有健康男方的叶酸、锌、硒、CoQ10或抗氧化复合补剂的通用生育剂量。
          - 对男性不育，AUA／ASRM 指南也认为这类补充剂的临床用途存疑，尚不足以推荐具体制剂。不要把试验剂量、成人营养总量或广告上的“推荐量”当作男方额外服药的方案。
          - 均衡饮食为基础；长期纯素、饮食明显受限、吸收问题或已知缺乏时，向医生／营养师讨论 B12 等针对性补充。纠正缺乏与人人购买生育补剂是两回事。
        sources: [male-infertility, male-supplement-trial, infertility-supplements, b12]
      - id: male-testing-plan
        title: 分清男方常规健康复核与精液、激素检查
        who: 男方
        category: 就医
        when: 按病史、症状或双方不孕评估安排
        control: check
        detail:
          - 刚起步、没有已知生殖风险时，先做一般健康与用药复核；不把精液、性激素全套、阴囊超声、精子DNA碎片和染色体检查打包成每位男方的孕前必做项目。
          - 有明确风险或进入不孕评估时，病史加精液分析是常用起点。按实验室说明准备和采样；一次结果不能单独判断“能不能生”，异常时通常需要复查和专科解释。
          - 是否查与生精有关的 FSH／睾酮等激素、超声或遗传项目，由症状、体检和精液结果决定。这个判断不取代双方另行讨论的遗传病携带者筛查。
        sources: [male-infertility, fertility-evaluation]
  - id: before-shopping
    number: '00C'
    title: 备孕就能准备的东西
    subtitle: 叶酸见女方采购项；其余按用途和需要少量准备
    anchor: preconception
    start: -90
    end: 0
    tasks:
      - id: buy-blood-pressure-monitor
        title: 血压计：先确认是否需要家测，再选购
        who: 共同
        category: 采购
        when: 按需购买 · 高血压史、读数异常或医生建议家庭监测时
        control: check
        detail:
          - 孕前就诊可以先测血压；开始备孕不等于必须买血压计，也不等于每天在家测。若医生建议家测，先准备设备，再按其要求记录；男女都可因个人病史需要家测。
          - 选经过准确性验证的自动上臂式，测量上臂周长后按厂商范围选袖带；孕期使用还需确认在孕妇人群中验证。可用 AHA 链接的 ValidateBP 查设备，再向医生确认适用性。
          - 下次带设备去诊所，对照读数、确认袖带和操作；购买前可问诊所或保险是否有供给、借用或给付安排，不预设一定覆盖。
          - 使用时测前30分钟避免吸烟、咖啡因和运动，排空膀胱并静坐至少5分钟；裸露上臂、背部和手臂有支撑、双脚平放，手臂与心脏同高，不说话。每次两次、间隔1分钟，按医生要求记录，联络阈值也请团队给出。
        sources: [home-bp, validated-bp, bp]
      - id: home-weight-scale
        title: 体重秤和普通体温计：先检查家里已有的
        who: 共同
        category: 采购
        when: 可选准备 · 能复用就先不添置
        control: check
        detail:
          - 身高体重可以先在诊所测。家里已有能正常使用的普通体重秤就复用；没有且希望在家记体重时，再买普通款，不必为备孕升级智能体脂或“孕妇专用”设备。
          - 家用体重记录尽量用同一台秤、相近时段；身高体重及个人健康目标在孕前咨询时讨论，不靠体脂数字自行诊断。
          - 普通体温计可作日常生病时测温之用，不要求从零开始就每天测基础体温。宝宝的测温方式与用品在孕晚期再按儿科建议准备。
        sources: [prepregnancy-counseling, natural-fertility, fever]
      - id: buy-pregnancy-tests
        title: 验孕试剂：开始尝试时备少量
        who: 女方
        category: 采购
        when: 按需购买 · 开始尝试前后，不用囤大量
        control: check
        detail:
          - 先买少量未过期、说明书清楚的家用尿妊娠试剂，记住检测和读数时间；不把排卵试纸当验孕试纸用。
          - 月经该来却没来时按产品说明检测；晨尿通常更有利于检出。过早阴性不能排除怀孕，仍怀疑时可隔几天复测；持续不来月经或结果不明时联系医生。
          - 阳性后联系产科安排照护；明显腹痛、出血、晕厥等症状需要及时评估，不等重复检测或清单提醒。
        sources: [pregnancy-test, warnings]
      - id: buy-ovulation-tests
        title: 排卵试纸：有需要再买，不是必需品
        who: 共同
        category: 采购
        when: 可选购买 · 希望辅助安排同房、且愿意按说明检测时
        control: check
        detail:
          - 检测女方尿液的 LH（促黄体生成素）高峰，帮助估计排卵时机。开始测的日期、取尿时段和判读按该产品说明，不通用套用验孕的晨尿规则。
          - 阳性提示 LH 上升，不证明一定已排卵或一定会怀孕；不能用来避孕。月经明显不规则时可先问医生，日历App也不能精确确认每个人的排卵日。
          - 如果测试让人焦虑，可先保持规律同房，不同时囤基础体温设备、激素监测仪和多款试纸。婴儿床、座椅、奶粉和尿布依后面的孕期时间线再准备。
        sources: [ovulation-test, natural-fertility]
  - id: early
    number: '01'
    title: 先把照护接上
    subtitle: 确认怀孕至9周6天
    anchor: pregnancy
    start: 0
    end: 69
    tasks:
      - id: call-ob
        title: 联系产科或助产士，安排首次评估
        category: 就医
        when: 发现怀孕后尽快联系，不等时间线提醒
        control: check
        detail:
          - 告诉诊所末次月经第一天、验孕情况、症状和既往病史，询问首次就诊时间。超声和抽血的时间按症状与个人情况安排。
          - 索取白天和夜间值班电话，问清分娩医院与急症入口。严重腹痛、明显出血、晕厥等症状需要及时评估。
        sources: [prenatal, warnings]
      - id: first-visit-questions
        title: 准备首诊问题与资料
        category: 就医
        when: 首次就诊前
        control: progress
        detail:
          - 带身份证明、保险卡、病史与用药清单、既往检查和疫苗记录；问清初始化验、血型/Rh、感染筛查及检查结果如何查看。
          - 问医生如何确定和更正预产期、下次何时回诊、是否需要额外随访；把确认后的日期填进手记。
        sources: [prenatal, routine]
      - id: prenatal-nutrients
        title: 继续核对叶酸与孕期维生素
        category: 饮食
        when: 已怀孕也要查看标签，并带去首诊
        control: check
        detail:
          - 若备孕清单还未做，从现在核对并备好女方含叶酸的补充剂，见备孕区“买好并核对女方叶酸”。不要因已怀孕就把单方和复合产品自动叠加，高风险情况和个人产品用量请产科确认。
          - 不按孕月表自行叠加铁、碘、维生素D或草药；把实际饮食与产品标签一起给医生看。
        sources: [folate, nutrition]
      - id: food-routine
        title: 建立一套吃得下、吃得安全的日常饮食
        category: 饮食
        when: 全孕期；孕早期可少量多餐
        control: check
        detail:
          - 食物煮熟，选巴氏杀菌奶制品；生熟分开并妥善冷藏。孕期避开生肉、生鱼和未杀菌食品；冷切肉等按 CDC 食品安全指引加热。
          - 咖啡、茶、能量饮料和巧克力中的咖啡因合计一般低于每天200毫克。避免酒精。
          - 若吃鱼，每周合计8–12盎司（约227–340克）低汞鱼，按 FDA 的“最佳选择”选种类；不靠多吃鱼油替代饮食。
          - 连水都留不住、尿量明显减少或持续呕吐时联系诊所，不强行照表进食。
        sources: [food, caffeine, fish, warnings]
      - id: season-vaccines
        title: 核对当季疫苗，留好接种记录
        category: 就医
        when: 现在查一次，预约前再确认当季政策
        control: check
        detail:
          - 芝加哥秋冬就诊时询问当季流感疫苗，并与产科核对当前 COVID-19 建议、个人适用产品和既往接种间隔。
          - Tdap 和母体 RSV 有各自孕周窗口，已单独放在后面的时间线；不要把这项勾选当成所有疫苗均已完成。
        sources: [vaccines, covid]
      - id: home-measure-plan
        title: 先确认家测需求、备好设备，再记录
        category: 家中
        when: 首诊时确认
        control: check
        detail:
          - 体重可用同一台秤、相近时段记录，目标由产科根据孕前情况确定。是否需要在家测血压、血糖，由团队判断。
          - 若需测血压，可在备孕时就按需要购买或借用，不等孕晚期；采购要求见备孕区“血压计：先确认是否需要家测，再选购”。已有设备先确认袖带、准确性验证和妊娠适用性，再向产科问监测频率和联络阈值。
          - 测前静坐至少5分钟，背部和手臂有支撑、双脚平放、裸露上臂，手臂与心脏同高，不说话。按团队方法保留读数；本页备注可写当天多次测量的时间与原始结果。
          - 手记只记原始数值与症状，不根据单次读数判断正常，也不自动调整药量。
        sources: [bp, home-bp]
  - id: screening
    number: '02'
    title: 把筛查选择问明白
    subtitle: 10至13周6天
    anchor: pregnancy
    start: 70
    end: 97
    tasks:
      - id: genetic-discussion
        title: 讨论遗传筛查与诊断检查的选择
        category: 就医
        when: 约10–13周；具体检测各有时间窗
        control: check
        detail:
          - 询问 cfDNA/NIPT（母血中胎盘来源DNA的筛查）、其他筛查及诊断检查各能回答什么、何时做、是否自费。
          - 筛查只估计风险，不能确诊；异常或不确定结果需要医生解释，并讨论遗传咨询或诊断检查。检查可以选择或拒绝。
        sources: [genetic]
      - id: results-followup
        title: 把检查结果和下一步记在一起
        category: 就医
        when: 每次结果出来后
        control: check
        detail:
          - 在备注写医生已解释的结论、待复查事项和下次预约日期。没有收到结果时主动向诊所确认。
          - 原始化验、影像和诊断仍保留在医疗系统；本页是家庭备忘，不充当完整病历。
        sources: [prenatal]
      - id: dental-movement
        title: 确认牙科照护和适合自己的活动方式
        category: 家中
        when: 孕早期开始，后续按情况调整
        control: check
        detail:
          - 告知牙科团队已怀孕，询问现有牙齿问题如何处理；日常继续刷牙和清洁牙缝。
          - 无禁忌者通常可以保持适度活动；首次或恢复运动前，问产科哪些活动和强度适合自己。身体不适时停止并联系团队。
        sources: [prepregnancy, exercise]
  - id: middle
    number: '03'
    title: 看清结构，慢慢准备
    subtitle: 14至23周6天
    anchor: pregnancy
    start: 98
    end: 167
    tasks:
      - id: anatomy-scan
        title: 预约胎儿结构超声
        category: 就医
        when: 通常18–22周
        start: 126
        end: 160
        control: check
        detail:
          - 提前向诊所预约，问清地点和准备要求；记录检查解释及是否需要补拍或进一步评估。
          - 这项检查也有局限，不保证发现所有结构或遗传问题。
        sources: [genetic]
      - id: food-labels
        title: 用饮食和化验核对营养，不按孕月自行加补剂
        category: 饮食
        when: 孕中期及每次用药变化时
        control: check
        detail:
          - 给饮食留出蛋白质、蔬菜水果、全谷和钙来源；把真正吃得下的食物写成一周菜单，让家人能接手采购和做饭。
          - 素食、食物过敏、吃不下或化验提示缺乏时，问产科是否需要营养师、化验或调整产品。不要仅凭“这个月该补什么”的旧表增加铁、碘或维生素剂量。
        sources: [nutrition]
      - id: gear-shortlist
        title: 先量空间，再列大件候选
        category: 采购
        when: 孕中期做功课，确认后分批购买
        control: progress
        detail:
          - 量卧室、门宽、储物和车辆空间。优先列平坦独立睡眠空间、合适的后向汽车座椅、喂养及尿布用品。
          - 查看美国召回信息、尺寸、保质/使用年限及退换期。安全座椅若来历、事故史或配件不明，跳过；不用一口气买齐月龄玩具和大包装奶粉。
        sources: [carseat, recalls, sleep]
      - id: leave-help
        title: 核对休假、课程和产后帮手
        category: 协作
        when: 孕中期开始联系
        control: progress
        detail:
          - 向学校或雇主核对适用的休假、课程调整、所需证明和工资安排，不把一般政策当作个人已获批准。
          - 按实际喂养和家庭安排考虑分娩课、婴儿急救/CPR课、哺乳支持与帮手。请帮手前谈清工作内容、费用、替班、感染时如何处理以及尊重照护选择。
        sources: [tuoba]
  - id: glucose
    number: '04'
    title: 核对检查，也核对日常
    subtitle: 24至27周6天
    anchor: pregnancy
    start: 168
    end: 195
    tasks:
      - id: glucose-screen
        title: 确认糖筛预约与准备
        category: 就医
        when: 常见24–28周；风险因素可能改变安排
        start: 168
        end: 202
        control: check
        detail:
          - 询问自己做哪种筛查、是否需要空腹、需留多长时间，以及结果异常后如何复查。不同检测的准备要求不同。
          - 不提前节食、停药或改变饮食去“通过”筛查。是否在家测血糖及目标值由医疗团队决定。
        sources: [routine]
      - id: fetal-pattern
        title: 问清胎动变化时如何联系产科
        category: 就医
        when: 已能感觉胎动后，按团队指导
        control: check
        detail:
          - 留意宝宝相对平常的活动模式，询问何时开始以及如何做胎动计数。每个人、每个孕周不一定用同一个计数标准。
          - 胎动明显减少或改变时直接联系团队。家用胎心仪听到声音不能排除问题，也不应延迟就医。
        sources: [movement, warnings]
      - id: feeding-plan
        title: 把喂养支持列进产后计划
        category: 协作
        when: 孕中期至孕晚期
        control: progress
        detail:
          - 讨论母乳、配方奶或混合喂养的意愿，向医院问哺乳顾问和出院后的求助入口。预先计划夜间如何轮换、照护者怎样休息。
          - 如需吸奶器，向保险确认是否覆盖、可领取时间与供应商。奶瓶和奶粉先少量准备，之后按宝宝情况及儿科建议调整。
        sources: [feeding, tuoba]
  - id: third
    number: '05'
    title: 为回家腾出位置
    subtitle: 28至31周6天
    anchor: pregnancy
    start: 196
    end: 223
    tasks:
      - id: tdap
        title: 与产科安排本次妊娠的 Tdap
        category: 就医
        when: 每次妊娠通常27–36周，优先窗口早段
        start: 189
        end: 258
        control: check
        detail:
          - Tdap 预防破伤风、白喉和百日咳；孕期接种能把保护性抗体传给宝宝。告诉团队此前的接种和过敏情况。
          - 家人也可核对自己的常规疫苗状态，但不照搬孕妇的接种安排。
        sources: [vaccines]
      - id: safe-sleep-space
        title: 搭好独立、平坦的睡眠空间
        category: 家中
        when: 分娩前准备好；出生后每次睡眠都使用
        control: progress
        detail:
          - 用符合现行安全标准的婴儿床或摇篮，坚实平坦床垫配合身床单。每次睡觉都仰卧，与照护者同室、不同床。
          - 清走枕头、松软被褥、围栏软垫、毛绒玩具和睡眠定位器；斜躺摇椅、汽车座椅不作为日常睡床。不要因吐奶或胀气改成侧睡或趴睡。
        sources: [sleep]
      - id: car-seat
        title: 准备后向安全座椅并试装
        category: 采购
        when: 分娩前完成，预留检查和调整时间
        control: progress
        detail:
          - 按宝宝体型、车辆和厂商说明选择后向座椅；核对召回、有效使用年限、所有标签与配件。安装后学习束带和胸扣的正确位置。
          - 用官方检查点预约安装核查。回家当天避免在安全带下穿蓬松厚外套，先正确扣好，再在束带外保暖。
        sources: [carseat, inspection]
      - id: home-basics
        title: 少量备齐清洁、喂养和量测用品
        category: 采购
        when: 孕晚期分批准备
        control: progress
        detail:
          - 先备适量新生儿/下一号尿布、温和清洁用品、换洗衣物、喂养所需用品与数字体温计；按住房条件安排洗手、换尿布和夜间照明的位置。
          - 问儿科如何测温。体重秤、血压计若已在备孕阶段按需要准备，可先核对继续使用；这时重点备宝宝测温用品，不把家用胎心仪、婴儿枕头或睡眠定位器列为必需品。
          - 检查烟雾和一氧化碳报警器。秋冬保证供暖与空气流通，不给宝宝过度包裹。
        sources: [fever, sleep, co]
  - id: ready
    number: '06'
    title: 把临产前的路走一遍
    subtitle: 32至36周6天
    anchor: pregnancy
    start: 224
    end: 258
    tasks:
      - id: rsv-choice
        title: 确认 RSV 预防方案与季节窗口
        category: 就医
        when: 美国大陆通常9–1月，且孕32周0天至36周6天
        start: 224
        end: 258
        control: check
        detail:
          - RSV 是呼吸道合胞病毒。母体疫苗仅 Abrysvo 用于这个孕周窗口；不能因为进入孕晚期就在任意季节或任意孕周接种。
          - 和产科、未来儿科讨论母体疫苗与宝宝出生后抗体预防的选择，通常不需要两者都用。既往妊娠接种过、预计分娩时间等也会影响方案。
        sources: [rsv]
      - id: gbs
        title: 约好 GBS 筛查并记下处理方案
        category: 就医
        when: 通常36周0天至37周6天
        start: 252
        end: 265
        control: check
        detail:
          - GBS 是 B 族链球菌。筛查结果帮助团队决定分娩时是否需要抗生素，阳性不等于宝宝已感染。
          - 既往病史可能改变检查和用药安排；把结果、药物过敏及分娩时计划交给接生团队。
        sources: [gbs]
      - id: hospital-bag
        title: 按实际医院提供的用品整理待产包
        category: 采购
        when: 分娩前备好一个小包
        control: progress
        detail:
          - 先问医院会提供哪些产妇、喂养和宝宝用品，再装身份证明、保险资料、药物清单、充电器、洗漱与换洗衣物、回家衣服和个人必需品。
          - 安全座椅装在车上，不放进大包；常用证件和联系人单独易取。无需照中国医院的品牌和数量清单整套购买。
        sources: [tuoba]
      - id: hospital-route
        title: 核实分娩入口、停车和备用交通
        category: 协作
        when: 孕晚期；降雪前再核对路线
        control: progress
        detail:
          - 向实际分娩医院确认白天/夜间入口、何时应先打电话、停车、访客、陪产和是否需要预登记。门诊地点不一定是分娩地点。
          - 演练出门拿包、车辆或其他交通、冬季路况和备用照护人。急症按医疗团队指示处理，严重情况拨911，不以网约车替代急救。
        sources: [warnings, birthcenter]
      - id: pediatrician
        title: 选好儿科并问清出院后的首诊流程
        category: 就医
        when: 分娩前联系
        control: check
        detail:
          - 确认接收新生儿、保险、出院后预约方式、夜间值班电话、喂养和黄疸问题的求助入口。
          - 问清出生时新生儿筛查、维生素K、疫苗和 RSV 预防的院方安排；计划按当期美国儿科指导确认，不照搬中国卡介苗或旧年度疫苗表。
        sources: [newborn, southloop]
      - id: postpartum-food-help
        title: 安排产后食物、家务与轮休
        category: 协作
        when: 孕晚期安排，出院后再调整
        control: progress
        detail:
          - 冷冻几份容易加热的饭菜，准备方便取用的水与零食；分派采购、清洁、洗衣、夜间换尿布和接待访客。
          - 产后饮食以能吃下、食物多样和充分补水为主；不按“月子第几天”强行断盐、限水或大量吃某种食物。贫血、糖尿病、过敏等按团队的个别方案处理。
        sources: [nutrition, tuoba]
  - id: waiting
    number: '07'
    title: 留出等待的余地
    subtitle: 37周起至分娩
    anchor: pregnancy
    start: 259
    end: 294
    tasks:
      - id: labor-call-plan
        title: 写下何时联系产房，不套统一宫缩规则
        category: 就医
        when: 临产前与接生团队确认
        control: check
        detail:
          - 问清宫缩、破水、出血、胎动变化和超过预产期时如何联系与到院。个人风险、距离和产次会改变安排。
          - 保持手机可用，把值班电话和分娩医院入口写在易见处。急症不等网站任务变成“当前”。
        sources: [labor, warnings]
      - id: preferences
        title: 和团队沟通分娩偏好及可能的变化
        category: 协作
        when: 产检或入院时
        control: check
        detail:
          - 讨论疼痛缓解、陪伴者、沟通语言、喂养意愿和分娩后安排；问清需要临时改变计划时怎样沟通。
          - 偏好写成一页简短备忘，陪伴者也读一遍。不要把网络生产经历当成个人分娩方案。
        sources: [labor]
      - id: after-birth-admin
        title: 提前问好新生儿保险与证件流程
        category: 协作
        when: 出生前查规则，出生后按期限办理
        control: progress
        detail:
          - 向当前保险问清添加新生儿的期限、材料和生效日期；雇主、学生和 Marketplace 计划可能不同，记录个人适用的截止日。
          - 向医院问出生登记、出生证明和 Social Security 申请的流程；不在本页保存证件号码或证件照片。
        sources: [enroll, birthcert, ssn]
  - id: birth
    number: '08'
    title: 出生，先照顾眼前
    subtitle: 出生至第2天 · 按出院安排
    anchor: birth
    start: 0
    end: 2
    tasks:
      - id: discharge-baby
        title: 核对宝宝出院清单与首诊时间
        category: 宝宝
        when: 出院前
        control: check
        detail:
          - 问清喂养、体重、胆红素/黄疸、听力和新生儿筛查结果及待回报项目；带走记录和求助电话。
          - 按出院指示安排儿科随访。早出院时通常需出院后24–48小时复查，出生后3–5天也是常见的首次检查窗口，具体以团队要求为准。
        sources: [newborn, firstcheck]
      - id: discharge-parent
        title: 写下产妇恢复、用药和复诊安排
        category: 就医
        when: 产妇出院前
        control: check
        detail:
          - 问清伤口/会阴护理、疼痛控制、出血、活动、喂养支持、情绪和血压随访；把每项个别医嘱和联系电话记下。
          - 产后照护需要持续联系，不能只等“六周复查”。ACOG 建议产后3周内联系，12周内完成全面评估；有高血压等情况可能需更早复查。
        sources: [postpartum, warnings]
      - id: feeding-support
        title: 现场练习喂养、抱持和换尿布
        category: 宝宝
        when: 在医院学一次，回家后按需求助
        control: progress
        detail:
          - 请护士或哺乳顾问看一次实际喂养，确认宝宝能有效吃奶；问清个人适用的频率、叫醒喂奶、配方配制和何时需要帮助。
          - 按宝宝饥饿信号喂养，不用固定毫升数或强制拉长间隔去套每个宝宝。配方严格按产品和团队要求配，粉状配方并非无菌。
          - 两个月以下、早产或免疫力弱的宝宝需额外防范阪崎克罗诺杆菌（Cronobacter）污染。向团队问清是否选无需兑水的液态即食配方；如用奶粉，按 CDC 和团队要求处理热水、冷却和保存，不只照普通温水冲调习惯。
        sources: [feeding, formula]
  - id: first-days
    number: '09'
    title: 回家后的前两周
    subtitle: 出生第3至14天
    anchor: birth
    start: 3
    end: 14
    tasks:
      - id: first-pediatric-visit
        title: 带记录去儿科，看体重、黄疸和喂养
        category: 宝宝
        when: 按出院指定日期，可能早于本阶段
        start: 2
        end: 5
        control: check
        detail:
          - 带出院材料、喂养/尿布记录与问题；医生根据出生周数、体重变化和检查决定是否需验胆红素、调整喂养或更早复查。
          - 黄疸加深、难叫醒、吃奶明显变差、尿量减少或觉得宝宝不对劲时，提前联系儿科，不等预约日。
        sources: [firstcheck, newborn]
      - id: feeding-diapers-log
        title: 按儿科要求记录喂养与湿尿布
        category: 宝宝
        when: 回家初期或团队要求时
        control: check
        detail:
          - 可在“每日记录”记24小时喂养次数、湿尿布片数和备注；宝宝体重和日龄会影响怎样解读这些数值。
          - 询问维生素D等个人适用补充方案、脐带护理与洗澡方式。睡前仍用仰卧、平坦独立睡床；哭闹时先排查需要，照护者太累时安全放下宝宝并换人。
        sources: [feeding, sleep]
      - id: parent-check-in
        title: 每天留一小段时间问产妇状态
        category: 协作
        when: 产后持续，异常时立即求助
        control: check
        detail:
          - 家人主动问睡眠、疼痛、出血、进食、情绪和是否需要帮助；安排能连续休息的时段，按医嘱活动和复查。
          - 持续低落、焦虑、难以应付或任何伤害自己/宝宝的念头都要及时求助；有即时危险时拨911或去急诊。
        sources: [postpartum, warnings]
      - id: complete-admin
        title: 确认保险已添加，追踪证件申请
        category: 协作
        when: 按自己计划规定的期限
        control: progress
        detail:
          - 按已查到的期限提交新生儿保险材料，确认生效日期和儿科账单如何处理；收到确认后留在个人文件夹。
          - 跟进医院说明的出生证明和 Social Security 流程。页面只记是否完成，不录证件号。
        sources: [enroll, birthcert, ssn]
  - id: settling
    number: '10'
    title: 让照护慢慢有节奏
    subtitle: 出生第15至42天 · 产后六周
    anchor: birth
    start: 15
    end: 42
    tasks:
      - id: ongoing-checkups
        title: 按儿科安排随访和当期疫苗计划
        category: 宝宝
        when: 个别复查及约1月龄；后续继续随诊
        control: check
        detail:
          - 记录下一次儿科预约和医生确认的疫苗安排；体重、喂养、早产或其他情况可能需要额外随访。
          - 本页不预填中国接种表，也不把某个旧年份的美国剂次表固定为个人医嘱。预约时核对当期计划。
        sources: [checkups]
      - id: postpartum-contact
        title: 完成产后联系，约好后续评估
        category: 就医
        when: 产后3周内联系；全面评估不晚于12周，按医嘱可更早
        start: 0
        end: 21
        control: check
        detail:
          - 把恢复、情绪、喂养、慢性病、避孕和后续计划一起问清；查看是否还有需要追踪的血压、化验或伤口问题。
          - 若产科已指定更早复查，优先执行。胸痛、呼吸困难、严重头痛、视物改变或大量出血随时需要求助。
        sources: [postpartum, warnings]
      - id: responsive-care
        title: 用简单互动认识宝宝，给家人留休息
        category: 家中
        when: 宝宝清醒且有人看护时
        control: check
        detail:
          - 抱持、说话、回应声音和目光即可，不必购买成套早教课程。清醒并有成人持续看护时，按儿科建议逐渐练习趴着玩；睡眠仍仰卧。
          - 调整轮班和求助安排，允许计划随实际喂养、恢复和家庭体力改变。0–12月经验文章放在参考资料，发育疑问交给儿科讨论。
        sources: [tummy, sleep, tuoba]
